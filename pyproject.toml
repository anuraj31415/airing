[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airing"
version = "0.1.0"
description = "Show this week's airing anime and countdowns from AniList"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
airing = "airing.cli:run"

[tool.setuptools]
packages = ["airing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
